openapi: 3.1.0
info:
  title: Charging seam — ECEV (canonical)
  version: 0.1.0
  description: >
    Canonical contract for the charging (ECEV/CBEV) seam — prepaid balance. Mock for the demo.
    Amounts are minor units (euro cents). Operations never throw — they return a SeamResult.
    Runtime validation: src/schemas/charging.ts. rateAndDeduct refuses to go negative.

    FASE 8 MAPPING (confirmed via DXP docs, DMP Evolved):
    - getBalance/topUp map to TMF654 Prepay Balance Management (balance enquiry + adjustment +
      voucher/voucherless recharge). BUT the real balance is NOT a single scalar: CBEV returns
      an account-level `monetaryBalance {amount, units}` PLUS product/allowance buckets (e.g.
      "Data 15GB" with a remaining amount). When wiring the http driver, model those as distinct
      balances, not one number. Our canonical Balance is the monetary balance only (demo scope).
    - rateAndDeduct is NOT TMF654 — in DMP Evolved it is the CBEV Payment Connector (deduct +
      refund on order failure, calling CHA rating). Keep it in this seam canonically, but the
      http mapping targets the Payment Connector, not TMF654.
tags:
  - name: charging
paths:
  /charging/customers/{customerId}/balance:
    get:
      tags: [charging]
      operationId: getBalance
      summary: The customer's prepaid balance (null if none yet).
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Balance or null.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Balance"
                  - type: "null"
  /charging/customers/{customerId}/top-up:
    post:
      tags: [charging]
      operationId: topUp
      summary: Add credit to the balance.
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor]
              properties: { amountMinor: { type: integer, description: "Euro cents, positive." } }
      responses:
        "200":
          description: The new balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }
  /charging/customers/{customerId}/deduct:
    post:
      tags: [charging]
      operationId: rateAndDeduct
      summary: Deduct a charge; refuses to go negative.
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor]
              properties: { amountMinor: { type: integer } }
      responses:
        "200":
          description: Confirmation.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean, enum: [true] } }
components:
  schemas:
    Balance:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer, description: "Euro cents." }
        currency: { type: string, enum: [EUR] }
        validUntil: { type: string, format: date-time }
