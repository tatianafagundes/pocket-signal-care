      schema:
        type: string
    X-Tenant-Id:
      name: X-Tenant-Id
      in: header
      description: >-
        In a multitenancy mode, the tenant can be informed in the *X-Tenant-Id* header. This information is
        used to validate the user privilege.

        The *X-Tenant-Id* is mandatory in case the JWT token has more than one tenant associated with it.
        If the JWT token has only one tenant, the *X-Tenant-Id* is not mandatory and it will be inferred
        from the JWT token.

        *X-Tenant-Id* is only used in a multitenancy mode. Otherwise, an error is thrown.
      schema:
        type: string
