openapi: 3.0.1
info:
  title: TMF 622 - Product Ordering Management REST Interface version 5.0
  description: >
    **January 2025**


    The Product Ordering API provides a standardized mechanism for placing a product order with all
    of the necessary order parameters. The API consists of a simple set of operations that interact
    with CRM/Order Negotiation systems in a consistent manner. A product order is created based on a
    product offer that is defined in a catalog. The product offer identifies the product or set of
    products that are available to a customer, and includes characteristics such as pricing, product
    options and market. This API provide a task-based resource to request order cancellation.


    The product order references the product offer and identifies any specific requests made by the
    customer.


    **Product Order resource**


    A Product Order is a type of order which can be used to place an order between a customer and a
    service provider or between a service provider and a partner, and vice versa. Main Product Order
    attributes are its identifier, state, priority category (mass market, Enterprise, etc.) related
    dates (start, completion, etc.), related billing account, related parties and order items. Main
    Order Items (aka order lines) attributes are the ordered offering and product characteristics
    with the related action to be performed (e.g. add or delete the products), state, location
    information for delivery, order item price and price alteration.


    Product Order API performs the following operations on product order:

       * Retrieval of a product order or a collection of product orders depending on filter criteria
       * Partial update of a product order (including updating rules)
       * Creation of a product order (including default values and creation rules) - The productOrder could be created
       in draft (the product order requester is not yet ready to submit it and draft order could be freely updated) or requester could
       ask to an acknowledged state which means that requester submitted the order.
       * Deletion of product order (for administration purposes)
       * Notification of events on product order.


    The entities will be used in the TMF622 response depending on the value of the **pom.mapperMode** configuration. See details at
    "Home / Installation and Configuration / Microservices Installation and Configuration Guide / Product Ordering Management Installation / Product Ordering Management Installation on Kubernetes Cluster / Product Ordering Management Configuration Parameters."
    in the EOC CPI documentation.


    The <u>Ext</u> at the end of the entity name means that it has been extended with EOC fields on top of the TMF entity.


    Entities that have @baseType equal to <u>OrderCare</u> are fully extended from EOC and do not have any TMF fields.


    **Cancel Product Order resource**


    This resource is used to request a product order cancellation.

    Product Order API performs the following operations on CancelProductOrder resource:

       * Retrieval of a cancel product order or a collection of cancel product orders
       * Creation of a cancel product order
       * Notification of events on cancel product order.


    Copyright © TM Forum 2021. All Rights Reserved
  version: 5.0.0
servers:
  - url: 'https://{host}/eoc/productOrderingManagement/v5/'
    variables:
      host:
        default: your-cluster
paths:
  /productOrder:
    get:
      tags:
        - ProductOrderV5
      summary: List or find ProductOrder objects
      description: |
        This operation lists the product order entities or a specific order entity if the id is passed in the request. If the request is successful, the response code 200 is returned.<br><br>
        The operation supports partial representation by using the fields parameter. Values are a comma-delimited list of the fields to be returned. Id and href are always returned. Only fields that contain values or default values are returned. An attribute selection is enabled for all first level attributes and also for the special fields @type and @baseType.<br><br>
        If the query is followed by a filtering expression, the response includes only the matched resources. The filtering selection is enabled on all first-level attributes that are neither an object nor a special field. As for the second level, only channel.id is supported.<br><br>
        Attribute Selection enables you to select only fields that you want to retrieve from the object. Similar to the SELECT into a SQL query.<br><br>
        Filtering enables you to retrieve only the data that meets certain parameters established. Similar to the WHERE into a SQL query.<br><br>
        It is also possible to add filters, such as "like" and "in", when filtering **relatedParties**, **relatedEntities**, **jeopardies**, **milestones**, and **errorMessages**. The "like" filter enables the use of the asterisk (*) symbol, which works in the same way as the % character in the SQL.<br><br>
        When filtering by **relatedParties.role=Customer** or **relatedEntities.type=Place**, the query also considers the information from item level, once an order item is part of an order.<br>
        **Note:** To search for **relatedParties.reference** and **relatedParties.role**, both parameters **must** be used. The same applies to **relatedEntities.type** and **relatedEntities.reference**.<br><br>
        When filtering by **jeopardies**, **milestones** or **errorMessages**, both order and item levels are considered by the query, once an order item is part of an order.<br><br>
        For date fields (for example, **requestedCompletionDate**, **expectedCompletionDate**, **jeopardies.alertDate**, **milestones.milestoneDate**, **errorMessages.errorDate**, among others), operators **>**, **>=**, **<**, and **<=** can be provided as **.gt**, **.gte**, **.lt**, **.lte**.<br><br>

        **Query Parameters:**<br>
        The following table describes the query parameters:<br>
        **Note:** All of them are optional.

        The **relatedOrders** parameter is not a searchable field.

        | Parameter                  | Type   | Description |
        |----------------------------|--------|-------------|
        | `id`                       | String | Return an order filtered by id. |
        | `owner`                    | String | Return the list of orders filtered by owner. |
        | `correlationID`            | String | Return an order filtered by correlationID. |
        | `quoteID`                  | String | Return an order filtered by quoteID. |
        | `createdBy`                | String | Return the list of orders filtered by createdBy. |
        | `createdDate`              | Date   | Return an order filtered by createdDate. |
        | `channel`                  | String | Return the list of orders filtered by channel. |
        | `description`              | String | Return the list of orders filtered by description. |
        | `biType`                   | String | Return the list of orders filtered by biType. |
        | `lastModifiedDate`         | Date   | Return an order filtered by lastModifiedDate. |
        | `modifiedBy`               | String | Return the list of orders filtered by modifiedBy. |
        | `requestedCompletionDate`  | Date   | Return an order filtered by requestedCompletionDate. |
        | `assignedPriority`         | String | Return the list of orders filtered by assignedPriority. |
        | `state`                    | String | Return the list of orders filtered by state. |
        | `requestedStartDate`       | Date   | Return an order filtered by requestedStartDate. |
        | `expirationDate`           | Date   | Return an order filtered by expirationDate. |
        | `quoteExpirationDate`      | Date   | Return an order filtered by quoteExpirationDate. |
        | `externalOrderID`          | String | Return an order filtered by externalOrderID. |
        | `isBundled`                | String | Return the list of orders filtered by isBundled. |
        | `mode`                     | String | Return the list of orders filtered by mode. |
        | `submittedDate`            | Date   | Return an order filtered by submittedDate. |
        | `isLocked`                 | String | Return the list of orders filtered by isLocked. |
        | `biSpecification`          | String | Return the list of orders filtered by biSpecification. |
        | `requester`                | String | Return the list of orders filtered by requester. |
        | `quoteOn`                  | String | Return the list of orders filtered by quoteOn. |
        | `orderGroup`               | String | Return an order filtered by orderGroup. |
        | `version`                  | String | Return the list of orders filtered by version. |
        | `customerID`               | String | Return the list of orders filtered by customerID. |
        | `extendedState`            | String | Return the list of orders filtered by extendedState. |
        | `orderRole`                | String | Return the list of orders filtered by orderRole. |
        | `pmProjectId`              | String | Return the list of orders filtered by pmProjectId. |
        | `pmProjectType`            | String | Return the list of orders filtered by pmProjectType. |
        | `batchOrderId`             | String | Return the list of orders filtered by batchOrderId. |
        | `shoppingCartId`           | String | Return the list of orders filtered by shoppingCartId. |
        | `expectedCompletionDate`   | String | Return the list of orders filtered by expectedCompletionDate. |
        | `containsOiState`          | String | Return the list of orders filtered by order item state. |
        | `containsOiCompletionDate` | String | Return the list of orders filtered by order item requestedCompletionDate. |
      operationId: listProductOrder
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Multi-Language_Support'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/API_version'
        - $ref: '#/components/parameters/X-Tenant-Id'
      responses:
        '200':
          $ref: '#/components/responses/200ProductOrderArray'
        '206':
          $ref: '#/components/responses/206ProductOrderPartialContentArray'
        '400':
          $ref: '#/components/responses/400ProductOrder_Search'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    post:
      tags:
        - ProductOrderV5
      summary: Creates a ProductOrder
      description: >-
        This operation creates a Product Order entity. The location header is returned with the URL pointing to the created resource.
        If this request is successful, the response code 201 is returned.
      operationId: createProductOrder
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Content-Type'
        - $ref: '#/components/parameters/Multi-Language_Support'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/API_version'
        - $ref: '#/components/parameters/X-Tenant-Id'
      requestBody:
        $ref: '#/components/requestBodies/ProductOrder_Create'
      responses:
        '201':
          $ref: '#/components/responses/201ProductOrder'
        '400':
          $ref: '#/components/responses/400ProductOrder'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  '/productOrder/{id}':
    get:
      tags:
        - ProductOrderV5
      summary: Retrieves a ProductOrder by ID
      description: >-
        This operation retrieves a ProductOrder entity. Attribute selection enabled for all first
        level attributes.
      operationId: retrieveProductOrder
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          $ref: '#/components/responses/200ProductOrder_Get'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    delete:
      tags:
        - ProductOrderV5
      summary: Deletes a ProductOrder
      description: |
        This operation deletes a product order entity.<br>
        The Order must not be in Acknowlegded or In Progress state.<br>
        If the request is successful, the response code 204 is returned.
      operationId: deleteProductOrder
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/X-Tenant-Id'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    patch:
      tags:
        - ProductOrderV5
      summary: Partially update a ProductOrder
      description: |
        This operation allows partial updates of a product order entity.<br><br>
        If the request is successful, the response code **200** is returned.<br><br>
        **Note:**
        It is possible to modify the **productOrderItem.product.id** field when using the **Update** method, but there is no validation to check the invalid values.<br><br>

        **Patchable Attributes:**
        - `category`
        - `description`
        - `expectedCompletionDate`
        - `note`
        - `notificationContact`
        - `productOrderItem`
        - `relatedOrders`
        - `startDate`
        - `state`
        - `productOrderItem.state`

        **Conditionally Patchable Attributes:**
        These attributes can only be modified if the order is in the `Acknowledged` state and the fulfillment process has not started:
        - `relatedParty`
        - `requestedCompletionDate`
        - `requestedStartDate`
        - `productOrderItem.product`
        - `productOrderItem.productOrderItemRelationship`
        - `productOrderItem.product.place`
        - `productOrderItem.product.relatedParty`

        Additionally, the following attributes can only be patched if the fulfillment process **has not started or is suspended**:
        - `productOrderItem.appointment`
        - `productOrderItem.product.productSpecification`
        - `productOrderItem.product.productRelationship`
        - `productOrderItem.product.productCharacteristic`

        **Non-Patchable Attributes:**
        The following attributes **cannot be updated** under any circumstances:
        - `href`
        - `id`
        - `externalId`
        - `creationDate`
        - `productOrderItem.id`
      operationId: patchProductOrder
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Multi-Language_Support'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/API_version'
        - $ref: '#/components/parameters/X-Tenant-Id'
      requestBody:
        $ref: '#/components/requestBodies/ProductOrder_Update'
      responses:
        '200':
          $ref: '#/components/responses/200ProductOrder_Patch'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403ProductOrder_Patch'
        '404':
          $ref: '#/components/responses/404ProductOrder_Patch'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /productOrder/{id}/revise:
    post:
      operationId: reviseProductOrder
      summary: Revise a ProductOrder
      description: |
        This operation is used to revise an existing product order. The Order ID to be revised must be informed in the URL, and the Order ID to revise existing order must go in the payload.<br><br>
        The original order is canceled.

        If the request is successful, the response code 201 is returned.
      tags:
        - ProductOrderV5
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Multi-Language_Support'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/API_version'
        - $ref: '#/components/parameters/X-Tenant-Id'
      requestBody:
        $ref: '#/components/requestBodies/ProductOrderRevise'
      responses:
        '201':
          $ref: '#/components/responses/201ProductOrder_Revise'
        '400':
          $ref: '#/components/responses/400ProductOrder_Revise'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
  '/productOrder/{id}/{task}':
    post:
      operationId: performTaskProductOrder
      summary: Perform a task to Product by ID
      description: This operation perform a task (Cancel, Suspend, Resume, and Run) to ProductOrder entity. Attribute selection is enabled for all first level attributes.
      tags:
        - ProductOrderV5
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Task'
      requestBody:
        $ref: '#/components/requestBodies/ExecuteTask'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403ProductOrder_ExecuteTask'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
  /cancelProductOrder:
    get:
      summary: List the Cancel Product Order entities
      description: |
        This operation lists the cancel product order entities.<br><br>
        The operation lists all cancel product orders and supports filtering by state using the **cancelOrderState.in** parameter. Values are a comma delimited list of the states to be returned.<br><br>
        If the query is followed by a filtering expression, the response includes only the matched resources.<br><br>
        If the request is successful, the response code 200 is returned.
      operationId: listCancelProductOrder
      tags:
        - CancelProductOrderV5
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Multi-Language_Support'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/API_version'
        - $ref: '#/components/parameters/X-Tenant-Id'
      responses:
        '200':
          $ref: '#/components/responses/200CancelProductOrderArray'
        '206':
          $ref: '#/components/responses/206CancelProductOrderPartialContentArray'
        '400':
          $ref: '#/components/responses/400CancelProductOrder_Search'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
