    Authorization:
      name: Authorization
      in: header
      description: >
        In the context of an HTTP transaction, authentication is a method for an HTTP user agent
        to provide identity and a claim when making request. HTTP *Authorization header* field
        is utilized for this purpose.

        The Authorization header uses the JSON Web Token (JWT) for authentication and authorization.

        For example: *Authorization: Bearer <JWT_REDACTED>*
        (example JWT removed from this vendored copy; see the original CPI doc for the sample token)
      schema:
        type: string
    API_version:
