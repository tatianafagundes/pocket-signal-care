  responses:
    '200':
      description: >
        OK:
        The request has succeeded. Header
        Notes: None
        Body Notes: The requested resource will be returned in the body.
    '201':
      description: >
        Created:
        The request has created a new resource.
        Header Notes: The Location header contains the URI of the newly created resource.
        Body Notes: The response returns an entity describing the newly created resource.
    '202':
      description: Accepted
    '204':
      description: >
        No Content:
        The request succeeded, but there is no data to return.
        Header Notes: None
        Body Notes: No body is allowed.
    '301':
      description: >
        Moved Permanently:
        The requested resource has moved permanently.
        Header Notes: The Location header contains the URI of the new location.
        Body Notes: The body may contain the new resource location.
    '302':
      description: >
        Found:
        The requested resource should be accessed through this location, but it actually
        resides in another location. This is typically used to set up an alias.
        Header Notes: The Location header contains the URI of the resource.
        Body Notes: The body may contain the new resource location.
    '400':
      description: >
        Bad Request:
        The request was badly formed. This is commonly used for creating or
        updating a resource, but the data was incomplete or incorrect.
        Header Notes: The Reason-Phrase sent with the HTTP status header
        may contain information on the error.
        Body Notes: The response may contain more information on the underlying
        error that occurred in addition to the Reason-Phrase.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: >
        Unauthorized:
        The request requires user authentication to access this resource.
        If the request contains invalid or missing authentication data, this code is sent.
        Header Notes: At least one authentication mechanism is specified in the
        WWW-Authenticate header. The Reason-Phrase sent with the HTTP status header
        may contain information on the error.
        Body Notes: The response may contain more information on the underlying
        error that occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidOrMissingTokenResponseError:
              $ref: '#/components/examples/invalidOrMissingTokenResponseError'
            missingAuthentication:
              $ref: '#/components/examples/missingAuthentication_response'
    '403':
      description: >
        Forbidden:
        The request is not allowed because the server is refusing to fulfill the request.
        A common reason for this is that the resource does not support the requested
        functionality or the user does not have the required privileges.
        Header Notes: The Reason-Phrase sent with the HTTP status header may contain
        information on the error.
        Body Notes: The response may contain more information on the underlying error
        that occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notEnoughPrivilege:
              $ref: '#/components/examples/notEnoughPrivilege_response'
    '404':
      description: >
        Not Found:
        The requested resource does not exist.
        Header Notes: None
        Body Notes: None
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            nonExistentProductOrder:
              $ref: '#/components/examples/nonExistentProductOrder_response'
    '405':
      description: >
        Method Not Allowed:
        The request used an HTTP method that is not supported for the resource because the
        API specification does not allow this method. If the resource does not support the
        function and it is a valid API operation, then a 403 is returned.
        Header Notes: The Allow header lists the supported HTTP methods for this resource.
        Body Notes: None
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '406':
      description: >
        Not acceptable:
        The server does not support the content representation delivered in the Accept header
        of the request.
        Header Notes: None
        Body Notes: None
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: >
        Conflict:
        There is a conflict. For example, if a concurrent update is made on the resource and
        the request cannot be completed due to a conflict with the current state of the resource.
        Header Notes: None
        Body Notes: None
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '412':
      description: >
        Precondition failed:
        The evaluation of some header fields, like Etag, failed.
        Header Notes: None
        Body Notes: None
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '415':
      description: >
        Unsupported Media Type:
        The requests data representation is not supported.
        Header Notes: None
        Body Notes: None
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: >
        Internal Server Error:
        An internal server error has occurred.
        Header Notes: None
        Body Notes: None
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '501':
      description: Not Implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '503':
      description: >
        Service Unavailable:
        The HTTP server is up, but the REST service is not available. This is typically
        caused by server overloading.
        Header Notes: Retry-After header
        Body Notes: None
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
