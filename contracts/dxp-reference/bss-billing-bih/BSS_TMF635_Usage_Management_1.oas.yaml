openapi: 3.0.3
info:
  contact:
    email: ericsson@example.com
    name: API Support
    url: http://www.ericsson.com/support
  description: |2-

    # Introduction

    This document is inspired on TMF635 Usage Management API REST Specification - Release 4.0.0

    The API performs the following operations on Product Balances:

    - Read Usage Events

    - Read Non-Usage Events

    The target group:

    - Solution Integrators

    ## Transfer Mechanism

    The transfer mechanism used is HTTPS. Both HTTP requests and HTTP responses use headers to send information about the HTTP message.
    The access port is configurable. Clients that use this interface should support a configurable port.

    ## Authentication and Authorization

    Authentication is controlled by the inclusion of a Java Web Token (JWT) in the authorization header of the HTTP message.

    ## HTTP Content Negotiation

    HTTP content negotiation uses versioning in the URL to request a certain version of the resource representation.

    ## BSS TMF635 Usage Management REST Interface

    The BSS TMF635 Usage Management REST Interface enables the user to retrieve, and search for information
    regarding the usage and non-usage events under the customer contract.

    ### Resources

    - Usage

    ## References

    - RFC 7230 - HTTP Message syntax and Routing

    - RFC 7231 - HTTP Semantics and Content

    - RFC 2818 - HTTP Over TLS

    - RFC 2616 - Hypertext Transfer Protocol - HTTP/1.1

    - RFC 7807 - Problem Details for HTTP APIs

    - RFC 2396 - Uniform Resource Identifiers (URI) - Generic Syntax

    ## Contact
  license:
    name: Ericsson Internal
    url: http://www.ericsson.com
  title: BSS TMF635 Usage Management REST Interface 1
  version: 1.0.0
  x-api-id: 50c34311-638a-4467-98d3-43100783ebc2
  x-audience: company-internal
  x-doc-type: interface-description
  x-doc-no: 1/155 19-CAF 101 637/1
  x-doc-rev: K
  x-doc-date-time: 2023-04-10T00:00:00Z
servers:
- description: The production API server
  url: "{scheme}://{host}:{port}/{basePath}"
  variables:
    scheme:
      default: https
      description: request scheme
      enum:
      - http
      - https
    host:
      default: host
      description: this value is assigned by the service provider
    port:
      default: "8443"
      description: the port of the service
    basePath:
      default: UsageManagement/v1
      description: Base path options
security:
- bearerAuth: []
tags:
- description: Usage operations
  name: usage
paths:
  /usage:
    get:
      description: This operation list or find Usage entities
      operationId: listUsage
      parameters:
      - description: Agreement Identifier of the subscriber for whom the usage event
          was created.
        example: CONTR0000000061
        explode: true
        in: query
        name: agreementId
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        style: form
      - description: The Business Unit identifier of which the Agreement belongs to.
        example: CSGBU
        explode: true
        in: query
        name: businessUnit
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        style: form
      - description: |-
          The billing date of a billed event in ISO 8601 format (YYYY-MM-DDThh:mm:ss.sTZD).
          Only applicable if the status parameter is set to 'billed'
        example: 2020-10-14T20:36:48.000-03:00
        explode: true
        in: query
        name: billingDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: The CDR identifier.
        example: "2010044694540"
        explode: true
        in: query
        name: cdrId
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        style: form
      - description: |-
          Product Identifier.
          It shall not be provided in case of the listed scenarios:
          - Getting usage or non-usage history of a contract.
        example: "439043"
        explode: true
        in: query
        name: productId
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        style: form
      - description: Indicates the billing status of the record.
        example: billed
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: Filters data valid for start date. Optional parameter in ISO
          8601 format (YYYY-MM-DDThh:mm:ss.sTZD).
        example: 2020-09-15T20:36:48.000-03:00
        explode: true
        in: query
        name: validFor.startDateTime
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Filters data valid for end date. Optional parameter in ISO 8601
          format (YYYY-MM-DDThh:mm:ss.sTZD).
        example: 2020-10-15T20:36:48.000-03:00
        explode: true
        in: query
        name: validFor.endDateTime
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: |-
          Usage Type.
          If not specified the type 'usage' is used as default.
        example: usage
        explode: true
        in: query
        name: usageType
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Charge Type.
          If not specified it is assumed that both one-time and recurring charges will be retrieved.
        example: oneTimeCharge
        explode: true
        in: query
        name: chargeType
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated properties to provide in response
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              examples:
                listUsagesResponse:
                  $ref: '#/components/examples/listUsagesResponse'
                listNonUsagesResponse:
                  $ref: '#/components/examples/listNonUsagesResponse'
                belEbListUsagesResponse:
                  $ref: '#/components/examples/belEbListUsagesResponse'
                belEbListNonUsagesResponse:
                  $ref: '#/components/examples/belEbListNonUsagesResponse'
              schema:
                items:
                  $ref: '#/components/schemas/Usage'
                type: array
          description: OK
        "206":
          content:
            application/json;charset=utf-8:
              examples:
                listUsagesResponse:
                  $ref: '#/components/examples/listUsagesResponse'
                listNonUsagesResponse:
                  $ref: '#/components/examples/listNonUsagesResponse'
                belEbListUsagesResponse:
                  $ref: '#/components/examples/belEbListUsagesResponse'
                belEbListNonUsagesResponse:
                  $ref: '#/components/examples/belEbListNonUsagesResponse'
              schema:
                items:
                  $ref: '#/components/schemas/Usage'
                type: array
          description: Partial Content
        "400":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Bad Request
        "401":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Unauthorized
        "403":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Forbidden
        "404":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Not Found
        "405":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Method Not Allowed
        "409":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Conflict
        "500":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal Server Error
        default:
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal Server Error
      summary: List or find Usage objects
      tags:
      - usage
  /usage/{id}:
    get:
      description: |-
        This operation retrieves a Usage entity. Attribute selection is enabled
        for all first level attributes.
      operationId: retrieveUsage
      parameters:
      - description: Identifier of the Usage
        example: 2010044694540UCONTR0000000060
        explode: false
        in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        style: simple
      - description: The Business Unit identifier of which the Agreement belongs to.
        example: CSGBU
        explode: true
        in: query
        name: businessUnit
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        style: form
      - description: Comma-separated properties to provide in response
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              examples:
                readUsageResponse:
                  $ref: '#/components/examples/readUsageResponse'
                readNonUsageResponse:
                  $ref: '#/components/examples/readNonUsageResponse'
                belEbReadUsageResponse:
                  $ref: '#/components/examples/belEbReadUsageResponse'
                belEbReadNonUsageResponse:
                  $ref: '#/components/examples/belEbReadNonUsageResponse'
              schema:
                $ref: '#/components/schemas/Usage'
          description: OK
        "400":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Bad Request
        "401":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Unauthorized
        "403":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Forbidden
        "404":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Not Found
        "405":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Method Not Allowed
        "409":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Conflict
        "500":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal Server Error
        default:
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal Server Error
      summary: Retrieves a Usage by ID
      tags:
      - usage
