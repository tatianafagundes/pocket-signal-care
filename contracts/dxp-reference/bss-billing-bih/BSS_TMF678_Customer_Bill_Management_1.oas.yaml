paths:
  /customerBill:
    get:
      description: This operation lists the customer bills.
      operationId: listCustomerBill
      parameters:
      - description: '- Document Code'
        example: INV00000128
        explode: true
        in: query
        name: billNo
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Account document type. The possible values are:
           - creditInclZero - Only credict document are listed, including zero ammount
           - credit - Only credit document are listed, excluding zero amount
           - debitInclZero - Only debit document are liste, including zero amount
           - debit - Only debit document are listed, excluding zero amount
          When no value is provided, both credit and debit documents are listed.
        example: creditInclZero
        explode: true
        in: query
        name: accountDocumentType
        required: false
        schema:
          type: string
        style: form
      - description: |-
          The Billing Account identifier
          Note: It is mandatory in case that Customer Identifier (customerId) is not provided.
        example: BA0000001780
        explode: true
        in: query
        name: billingAccountId
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        style: form
      - description: |-
          The billing request number.
          This parameter is only applicable when the function control modifyLargeAccount is set to value 'true'.
        example: Bill203040
        explode: true
        in: query
        name: billingRequestNumber
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        style: form
      - description: The Business Unit Identifier.
        example: CSGBU
        explode: true
        in: query
        name: businessUnit
        required: false
        schema:
          type: string
        style: form
      - description: |-
          The type of document. The possible values are:
           - invoice
           - creditMemo
           - debitNote
          When no value is provided all doucments are applicable
        example:
        - invoice
        explode: false
        in: query
        name: billDocumentType
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: The date of the bill in ISO 8601 format
        example: 2020-06-03T10:12:31.00Z
        explode: true
        in: query
        name: billingDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: |-
          The Customer Identifier.
          Note: It is mandatory in case that Billing Account Identifier (billingAccountId) is not provided.
        example: CUST0000334870
        explode: true
        in: query
        name: customerId
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        style: form
      - description: |-
          Document Status. The possible values are:
           - closed - Only closed documents are provided
           - open - Only open documents are provided
           - partlyOpenAndOpen - Only open and partly open documents are provided
           - partlyOpenAndClosed - Only partly open and closed documents are provided
          When no value is provided all documents are applicable
        example: closed
        explode: true
        in: query
        name: documentStatus
        required: false
        schema:
          type: string
        style: form
      - description: The due date of a billed event. Start Date Time.
        example: 2020-06-02T10:12:31.00Z
        explode: true
        in: query
        name: dueDate.startDateTime
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: The due date of a billed event. End Date Time.
        example: 2020-10-30T10:12:31.00Z
        explode: true
        in: query
        name: dueDate.endDateTime
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: The reference date of a billed event. Start Date Time.
        example: 2020-06-01T10:12:31.00Z
        explode: true
        in: query
        name: referenceDate.startDateTime
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: The reference date of a billed event. End Date Time.
        example: 2020-10-30T10:12:31.00Z
        explode: true
        in: query
        name: referenceDate.endDateTime
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "The minimum document amount, it must be an absolute value."
        example: 5
        explode: true
        in: query
        name: amountDueMin
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: "The maximum document amount, it must be an absolute value."
        example: 10
        explode: true
        in: query
        name: amountDueMax
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: |-
          Sort by the reference date of a billed event. The possible values are:
           - ascending - Oldest first
           - descending - Newest first (default)
        example: ascending
        explode: true
        in: query
        name: sortByReferenceDate
        required: false
        schema:
          type: string
        style: form
      - description: Requested number of resources to be provided in response requested
          by client
        example: 10
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: Requested index for start of resources to be provided in response
          requested by client.
        example: 1
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      - description: Comma-separated properties to provide in response
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json;charset=utf-8:
              examples:
                listCustomerBillsResponse:
                  $ref: '#/components/examples/listCustomerBillsResponse'
                BelEbListCustomerBillsResponse:
                  $ref: '#/components/examples/belEbListCustomerBillsResponse'
              schema:
                items:
                  $ref: '#/components/schemas/CustomerBill'
                type: array
          description: OK
        "206":
          content:
            application/json;charset=utf-8:
              examples:
                listCustomerBillsResponse:
                  $ref: '#/components/examples/listCustomerBillsResponse'
                belEbListCustomerBillsResponse:
                  $ref: '#/components/examples/belEbListCustomerBillsResponse'
              schema:
                items:
                  $ref: '#/components/schemas/CustomerBill'
                type: array
          description: Partial Content
          headers:
            X-Total-Count:
              description: Total number of items matching criteria.
              explode: false
              schema:
                type: integer
              style: simple
            X-Result-Count:
              description: Actual number of items returned in the response body.
              explode: false
              schema:
                type: integer
              style: simple
        "400":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Bad Request
        "401":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Unauthorized
        "403":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Forbidden
        "404":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Not Found
        "405":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Method Not Allowed
        "409":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Conflict
        "500":
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal Server Error
        default:
          content:
            application/problem+json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal Server Error
      summary: List customer bill objects.
      tags:
      - Customer Bill
