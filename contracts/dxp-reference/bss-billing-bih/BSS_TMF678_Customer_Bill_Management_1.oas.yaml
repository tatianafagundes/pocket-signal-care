            to a client user.
          example: Error communicating with downstream system
          type: string
        title:
          description: |
            A short summary of the problem type. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: Internal Server Error
          type: string
        status:
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 500
          exclusiveMaximum: true
          format: int32
          maximum: 600
          minimum: 100
          type: integer
        instance:
          description: Request path for this occurrence of the problem.
          example: /resource/123
          type: string
        supplementaryErrors:
          items:
            $ref: '#/components/schemas/SupplementaryError'
          type: array
