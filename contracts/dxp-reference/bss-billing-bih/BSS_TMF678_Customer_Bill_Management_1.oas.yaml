  x-audience: company-internal
  x-doc-type: interface-description
  x-doc-no: 1/155 19-CAF 101 642/1
  x-doc-rev: X
  x-doc-date-time: 2023-06-21T00:00:00Z
servers:
- description: The production API server
  url: "{scheme}://{host}:{port}/{basePath}"
  variables:
    scheme:
      default: https
      description: request scheme
      enum:
      - http
      - https
    host:
      default: host
      description: this value is assigned by the service provider.
    port:
      default: "8443"
      description: the port of the service
    basePath:
      default: CustomerBillManagement/v1
      description: Base path options
security:
- bearerAuth: []
tags:
- description: Bill Financial Charge operations.
  name: Bill Financial Charge
- description: Customer Bill operations.
  name: Customer Bill
- description: Customer Bill On Demand operations.
  name: Customer Bill On Demand
- description: Tax Item operations.
  name: Tax Item
- description: Bill Financial Tax Rate operations.
  name: Bill Financial Charge Tax Rate
- description: Applied Payment operations.
  name: Applied Payment
- description: Applied Payment operations.
  name: Applied Refund
- description: Applied Transaction operations.
