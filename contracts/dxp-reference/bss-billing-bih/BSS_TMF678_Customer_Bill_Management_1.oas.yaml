openapi: 3.0.3
info:
  contact:
    email: ericsson@example.com
    name: API Support
    url: http://www.ericsson.com/support
  description: |2-

    # Introduction

    This document is inspired on TMF678 Customer Bill Management API REST Specification - Release 20.0

    The API performs the following operations:

    - Retrieve Customer Bill

    - List Customer Bills

    - Retrieve Bill Financial Charge

    - List Bill Financial Charge

    - Retrieval of Tax Item

    - Retrieval of Bill Financial Charge Tax Rate

    - Retrieval of Applied Payment

    - Retrieval of Applied Refund

    - Retrieval of Applied Transaction

    - Create Customer Bill on demand

    - List Customer Bill on demand

    - Retrieve Customer Bill on demand

    - List Customer Information Bill

    - Retrieve Customer Information Bill

    The target group:

    - Solution Integrators

    ## Transfer Mechanism

    The transfer mechanism used is HTTPS. Both HTTP requests and HTTP responses use headers to send information about the HTTP message.
    The access port is configurable. Clients that use this interface should support a configurable port.

    ## Authentication and Authorization

    Authentication is controlled by the inclusion of a Java Web Token (JWT) in the authorization header of the HTTP message.

    ## HTTP Content Negotiation

    HTTP content negotiation uses versioning in the URL to request a certain version of the resource representation.

    ## BSS TMF678 Customer Bill Management REST Interface

    The BSS TMF678 Customer Bill Management REST Interface
    provides a standardized mechanism for the retrieval of
    customer bill information.

    ### Resources

    - Customer Bill

    - Bill Financial Charge

    - CustomerBillOnDemand

    - CustomerInformationBill

    ## References

    - RFC 7230 - HTTP Message syntax and Routing

    - RFC 7231 - HTTP Semantics and Content

    - RFC 2818 - HTTP Over TLS

    - RFC 2616 - Hypertext Transfer Protocol - HTTP/1.1

    - RFC 7807 - Problem Details for HTTP APIs

    - RFC 2396 - Uniform Resource Identifiers (URI) - Generic Syntax

    ## Contact
