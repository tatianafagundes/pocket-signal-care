openapi: 3.0.3
info:
  contact:
    email: ericsson@example.com
    name: API Support
    url: http://www.ericsson.com/support
  description: |2-

    # Introduction

    This document is not based on TMF, since that there is no definition from TMF for this prorietary data information.

    The API performs the following operations on the entities:

    - Retrieval of reference data information

    The target group:

    - Solution Integrators

    ## Transfer Mechanism

    The transfer mechanism used is HTTPS. Both HTTP requests and HTTP responses use headers to send information about the HTTP message.
    The access port is configurable. Clients that use this interface should support a configurable port.

    ## Authentication and Authorization

    Authentication is controlled by the inclusion of a Java Web Token (JWT) in the authorization header of the HTTP message.

    ## HTTP Content Negotiation

    HTTP content negotiation uses versioning in the URL to request a certain version of the resource representation.

    ## BSS Reference Data Management REST Interface

    The BSS Reference Data Management REST Interface enables the user to retrieve information about the entities
    handled by the APIs in BSS context. The reference data information the user retrieves provides meaningful description
    about extensible configuration data.

    ### Resources

    - AddressRole

    - AllocationTerm

    - Area

    - Bank

    - BillingCycle

    - BillingCycleChangeReason

    - BillMedium

    - BusinessUnit

    - Channel

    - ConversionRateType

    - CostCenter

    - Country

    - Currency

    - CustomerCategory

    - CustomerGroup

    - FinancialDocumentType

    - FinancialHandlingReason

    - FreeUnitPackage

    - GLAccount

    - IdentificationType

    - Jurisdiction

    - JurisdictionType

    - Language

    - LogicalResourceValueType

    - MaritalStatus

    - Nationality

    - NetworkCode

    - PartyOrCustomerCharacteristic

    - PaymentMethodType

    - PaymentTerm

    - PostingPeriod

    - StatusReason

    - TaxCategory

    - TaxCode

    - TaxType

    - Threshold

    - Title

    - TransactionType

    ## References

    - RFC 7230 - HTTP Message syntax and Routing

    - RFC 7231 - HTTP Semantics and Content

    - RFC 2818 - HTTP Over TLS

    - RFC 2616 - Hypertext Transfer Protocol - HTTP/1.1

    - RFC 7807 - Problem Details for HTTP APIs

    - RFC 2396 - Uniform Resource Identifiers (URI) - Generic Syntax

    ## Contact
  license:
    name: Ericsson Internal
    url: http://www.ericsson.com/license
  title: BSS Reference Data Management REST Interface 1
  version: 1.0.0
  x-api-id: 0d39ea77-596c-4ec3-9438-631378d31f80
  x-audience: company-internal
  x-doc-type: interface-description
