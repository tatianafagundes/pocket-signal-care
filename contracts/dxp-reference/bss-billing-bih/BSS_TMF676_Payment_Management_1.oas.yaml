  schemas:
    Id:
      description: "Public Identifier, max 256 characters."
      maxLength: 256
      pattern: ^(?=\s*\S).*$
      type: string
    AdjustType:
      description: The possible types to adjust.
      enum:
      - credit
      - debit
      type: string
    Payment:
      allOf:
      - $ref: '#/components/schemas/PaymentBase'
      - $ref: '#/components/schemas/Payment_allOf'
      description: The payment information.
    ErrorMessage:
      description: Error message schema.
      properties:
        code:
          description: "Application relevant detail, defined in the API or a common\
            \ list."
          example: BSS.500
          type: string
        reason:
          description: Explanation of the reason for the error which can be shown
            to a client user.
          example: Error communicating with downstream system
          type: string
        title:
          description: |
            A short summary of the problem type. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: Internal Server Error
          type: string
        status:
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 500
          exclusiveMaximum: true
          format: int32
          maximum: 600
          minimum: 100
          type: integer
        instance:
          description: Request path for this occurrence of the problem.
          example: /resource/123
          type: string
        supplementaryErrors:
          items:
            $ref: '#/components/schemas/SupplementaryError'
          type: array
      required:
      - code
      - reason
      type: object
    PaymentCreate:
      allOf:
      - $ref: '#/components/schemas/PaymentBase'
      - $ref: '#/components/schemas/PaymentCreate_allOf'
      description: |-
        'The payment create information. For PaymentType "transferFund" and "transferPayment", the required paymentMethod must be billingAccount.'
        'The correlatorId is required for all types of payment, except for transferPayment.'
      x-members-accessor: true
      x-dae-generic-annotation: |
        @com.ericsson.bss.bel.dae.referencedata.validator.ReferenceDataSimpleConstraint(entity="Channel", field="channel.id", message="Invalid Channel")
        @com.ericsson.bss.bel.dae.referencedata.validator.ReferenceDataSimpleConstraint(entity="FinancialHandlingReason", field="financialHandlingReasonRef.id", message="Invalid Financial Handling Reason")
        @com.ericsson.bss.bel.dae.referencedata.validator.ReferenceDataSimpleConstraint(entity="AllocationTerm", field="allocationTermRef.id", message="Invalid Allocation Term")
        @com.ericsson.bss.bel.dae.referencedata.validator.ReferenceDataSimpleConstraint(entity="PostingPeriod", field="postingPeriodRef.id", message="Invalid Posting Period")
        @com.ericsson.bss.bel.dae.referencedata.validator.ReferenceDataSimpleConstraint(entity="BusinessUnitExt", field="businessUnitRef.id", message="Invalid Business Unit")
    Refund:
      allOf:
      - $ref: '#/components/schemas/RefundBase'
      - $ref: '#/components/schemas/Refund_allOf'
      description: The refund information.
    RefundCreate:
      allOf:
      - $ref: '#/components/schemas/RefundBase'
      - $ref: '#/components/schemas/RefundCreate_allOf'
      description: The refund create information.
      x-members-accessor: true
      x-dae-generic-annotation: |
        @com.ericsson.bss.bel.dae.referencedata.validator.ReferenceDataSimpleConstraint(entity="Channel", field="channel.id", message="Invalid Channel")
        @com.ericsson.bss.bel.dae.referencedata.validator.ReferenceDataSimpleConstraint(entity="FinancialHandlingReason", field="financialHandlingReasonRef.id", message="Invalid Financial Handling Reason")
        @com.ericsson.bss.bel.dae.referencedata.validator.ReferenceDataSimpleConstraint(entity="PostingPeriod", field="postingPeriodRef.id", message="Invalid Posting Period")
        @com.ericsson.bss.bel.dae.referencedata.validator.ReferenceDataSimpleConstraint(entity="BusinessUnitExt", field="businessUnitRef.id", message="Invalid Business Unit")
    PaymentBase:
      description: Payment base attributes common to all payment operations messages.
      properties:
        totalAmount:
          $ref: '#/components/schemas/Money'
        allocationMethod:
          $ref: '#/components/schemas/AllocationMethodValue'
        originalTransactionId:
          description: "Public Identifier, max 256 characters."
          maxLength: 256
          pattern: ^(?=\s*\S).*$
          type: string
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        paymentReferenceDate:
          description: |-
            The date-time type as defined by RFC3339 - https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
            Example values are '2014-03-18T14:35:05Z', '2014-03-18T14:35:05.003Z' and '2014-03-18T14:35:05.003+01:00'
          format: date-time
          type: string
        dueDate:
          description: |-
            The date-time type as defined by RFC3339 - https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
            Example values are '2014-03-18T14:35:05Z', '2014-03-18T14:35:05.003Z' and '2014-03-18T14:35:05.003+01:00'
          format: date-time
          type: string
        description:
          description: String type of max 256 characters
          maxLength: 256
          type: string
        isSimulation:
          description: Indicates if the payment is a simulation. The customerId is
            required to simulate a payment
          type: boolean
        isReversed:
          description: Indicates if the payment is a reversal
          type: boolean
        reference:
          $ref: '#/components/schemas/Reference'
        correlatorId:
          description: "Public Identifier, max 256 characters."
          maxLength: 256
          pattern: ^(?=\s*\S).*$
          type: string
        bankCharge:
          $ref: '#/components/schemas/Money'
        handlingCharge:
          $ref: '#/components/schemas/Money'
      type: object
    String128:
      description: String type of max 128 characters
      maxLength: 128
      type: string
    String256:
      description: String type of max 256 characters
      maxLength: 256
      type: string
