          $ref: '#/components/schemas/ReferenceDataBaseRef'
        businessUnitRef:
          $ref: '#/components/schemas/ReferenceDataBaseRef'
        customerGroupRef:
          $ref: '#/components/schemas/ReferenceDataBaseRef'
        customerCategoryRef:
          $ref: '#/components/schemas/ReferenceDataBaseRef'
        costCenterRef:
          $ref: '#/components/schemas/ReferenceDataBaseRef'
        currencyRef:
          $ref: '#/components/schemas/ReferenceDataBaseRef'
