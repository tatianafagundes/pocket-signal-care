      format: date-time
      type: string
    TimePeriod:
      description: This type defines a time period value consisting of a startDateTime
        value and an endDateTime value. The startDateTime is inclusive and endDateTime
        is exclusive. The startDateTime and endDateTime are not allowed to have the
        same value. EndDateTime must not be before startDateTime
      properties:
        startDateTime:
          description: |-
            The date-time type as defined by RFC3339 - https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
            Example values are '2014-03-18T14:35:05Z', '2014-03-18T14:35:05.003Z' and '2014-03-18T14:35:05.003+01:00'
          format: date-time
          type: string
        endDateTime:
          description: |-
            The date-time type as defined by RFC3339 - https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
