      description: Customer base atributes common to all customer operations messages.
      properties:
        name:
          description: String type of max 128 characters
          maxLength: 128
          type: string
        externalCustomerId:
          description: String type of max 256 characters
          maxLength: 256
          type: string
        externalCustomerSetId:
          description: String type of max 256 characters
          maxLength: 256
          type: string
        isAgreementResponsible:
          description: |-
            Indicates if the Large Account member is resposible for the Agreement.
            For flat customers and large account head the default and only possible value is 'true'.
            For large account members the default value is 'false'.
          type: boolean
