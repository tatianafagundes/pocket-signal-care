openapi: 3.0.3
info:
  contact:
    email: ericsson@example.com
    name: API Support
    url: http://www.ericsson.com/support
  description: |2-

    # Introduction

    This document is inspired on TMF632 Party Management API REST Specification - Release 19.0.0

    The API performs the following operations on Individual:

    - Retrieval of an individual.

    - List a collection of individuals.

    - Update of an individual.

    - Creation of an individual.

    The API performs the following operations on Organization:

    - Retrieval of an organization.

    - List a collection of organizations.

    - Update of an organization.

    - Creation of an organization.

    The API performs the following operations on LargeAccountMember:

    - Retrieval of a large account member.

    - List a collection of large account members.

    The target group:

    - Solution Integrators

    ## Transfer Mechanism

    The transfer mechanism used is HTTPS. Both HTTP requests and HTTP responses use headers to send information about the HTTP message.
    The access port is configurable. Clients that use this interface should support a configurable port.

    ## Authentication and Authorization

    Authentication is controlled by the inclusion of a Java Web Token (JWT) in the authorization header of the HTTP message.

    ## HTTP Content Negotiation

    HTTP content negotiation uses versioning in the URL to request a certain version of the resource representation.

    ## BSS TMF632 Party Management REST Interface

    The BSS TMF632 Party Management REST Interface provides a standardized mechanism
    for the retrieval and management of party information. A party can be an individual
    or organization. Large Accounts are also supported by the interface. A Large Account
    is a group of individuals and or organizations in a tree structure, like corporations
    that have many members but also private groups like families. This API allows the
    management of identification information about the given party and creating, updating,
    listing party information and adding party to Large Accounts.

    ### Resources

    - Individual

    - LargeAccountMember

    - Organization

    #### Task Resources

    - ConvertFlatPartyToLargeAccountHead

    - ConvertFlatPartyToLargeAccountMember

    - ConvertLargeAccountBranchToNewLargeAccount

    - ConvertLargeAccountMemberToFlatParty

    - MoveCompleteLargeAccountToDifferentLargeAccount

    - MoveLargeAccountBranchToNewParent

    - RelocateLargeAccountBranchExcludingHeadOfBranch

    ## References

    - RFC 7230 - HTTP Message syntax and Routing

    - RFC 7231 - HTTP Semantics and Content

    - RFC 2818 - HTTP Over TLS

    - RFC 2616 - Hypertext Transfer Protocol - HTTP/1.1

    - RFC 7807 - Problem Details for HTTP APIs

    - RFC 2396 - Uniform Resource Identifiers (URI) - Generic Syntax

    ## Contact
