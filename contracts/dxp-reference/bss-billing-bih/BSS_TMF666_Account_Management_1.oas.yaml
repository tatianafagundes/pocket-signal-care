openapi: 3.0.3
info:
  contact:
    email: ericsson@example.com
    name: API Support
    url: http://www.ericsson.com/support
  description: |2-

    # Introduction

    This document is inspired on TMF666 Account Management API REST Specification, Release 19.0.1, November 2019, Version 4.0.1

    The API performs the following operations on Account:

    - Create Billing Account

    - List Billing Account

    - Read Billing Account

    - Update Billing Account

    - List Billing Account Assignment Rule

    - Read Billing Account Assignment Rule

    - Update Billing Cycle

    - Read Party Account

    - Update Party Account

    The target group:

    - Solution Integrators

    ## Transfer Mechanism

    The transfer mechanism used is HTTPS. Both HTTP requests and HTTP responses use headers to send information about the HTTP message.
    The access port is configurable. Clients that use this interface should support a configurable port.

    ## Authentication and Authorization

    Authentication is controlled by the inclusion of a Java Web Token (JWT) in the authorization header of the HTTP message.

    ## HTTP Content Negotiation

    HTTP content negotiation uses versioning in the URL to request a certain version of the resource representation.

    ## BSS TMF666 Account Management REST Interface

    The BSS TMF666 Account Management REST Interface provides a standardized mechanism for
    the retrieval and management of billing account information. This API handles the
    billing account and billing account assignment rule resources by providing information
    and by allowing the management of a customer billing account and billing account assignment
    rule.

    ### Resources

    - Billing Account

    - Billing Account Assignment Rule

    - Party Account

    ## References

    - RFC 7230 - HTTP Message syntax and Routing

    - RFC 7231 - HTTP Semantics and Content

    - RFC 2818 - HTTP Over TLS

    - RFC 2616 - Hypertext Transfer Protocol - HTTP/1.1

    - RFC 7807 - Problem Details for HTTP APIs

    - RFC 2396 - Uniform Resource Identifiers (URI) - Generic Syntax

    ## Contact
