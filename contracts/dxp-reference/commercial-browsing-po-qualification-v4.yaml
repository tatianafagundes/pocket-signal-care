openapi: 3.0.1
info:
  title: Commercial Browsing
  description: |-
    This document is the specification of the REST interface for Commercial Browsing. It is an Open API compliant with TMF679 Product Offering Qualification (POQ). It includes the model definition and all available operations.

    The following functionality and operations of TMF679 are out of scope in this specification:
    - Handling the asynchronized scenario of POQ.
    - Persistence of the POQ entity.
    - GET operations for the POQ entity.
    - PATCH operations for the POQ entity.
    - DELETE operations for the POQ entity.

    **Target Groups**

    The target groups for this document are as follows:
    - Application Developers
    - Solution Integrators
    - System Integration Teams
    - System Test Teams

    **Assumptions**

    The following assumptions are considered:
    - The REST interfaces embraces all aspects of the HTTP 1.1, including its request methods, response codes, and message headers.
    - The REST interfaces use the character set UTF-8.
    - The REST interfaces represent Time and Date data types by string as UTC Time, with the format: YYYY-MM-DDThh:mm:ssZ, for example, 2014-02-20T16:30:00Z.
    - Only authenticated and authorized users have access to use the APIs.
  version: "4.6"
paths:
  /productOfferingQualification/v4/productOfferingQualification:
    post:
      tags:
      - productOfferingQualification
      summary: Create Product Offering Qualification Method and URI
      description: "Executes the Product Offering Qualification (POQ) request and\
        \ returns the qualification result in the response. In the TMF679 spec, the\
        \ Product Offering Qualification request includes an array of <strong>ProductOfferingQualificationItem</strong>.\
        \ Each <strong>ProductOfferingQualificationItem</strong> represents a query.<br><strong>Note:\
        \ </strong>Only the first item of the productOfferingQualificationItem array\
        \ is used to query the product qualification."
      operationId: getRequiredPrivileges
      parameters:
      - name: Range
        in: header
        description: "The Product Offering Qualification (POQ) API supports pagination\
          \ of product offerings in qualification results and follows RFC 7233 HTTP/1.1\
          \ Range Requests standard. <br>The pagination is applied to the following\
          \ array: <strong>productOfferingQualification</strong>, <strong>productOfferingQualificationItem</strong>.\
          \ <br>The following HTTP headers govern the pagination <br>Request <ul><li>Range:\
          \ items={start}-{end}</li></ul>Response <ul><li>Content-Range: items {start}-{end}/{total}</li><li>Accept-Ranges:\
          \ items</li></ul>Where: <ul><li>start: zero-based index of first record</li><li>end:\
          \ zero-based index of the last record</li><li>total: total number of records\
          \ in the result set</li></ul>The following HTTP response code are assosciated\
          \ with pagination <ul><li>200 OK: complete response is returned</li><li>206\
          \ Partial Content: response is partial</li><li>416 Requested Range Not Satisfiable</li></ul>\
          \ <br><strong>Note:</strong> <ul><li>The HTTP Range request header is optional:\
          \ If not specified, then only 10 records are returned starting from index\
          \ 0, where 0 is the index of the first record.</li><li>The maximum number\
          \ of records in the response is 100 records. If the requested data has more\
          \ than 100 records, only 100 records are shown. This value is configurable\
          \ in the maxResponseItems parameter. For more information on the maxResponseItems\
          \ configuration parameter, refer to the Commercial Browsing deployment documentation\
          \ in the Ericsson Catalog Manager Installation and Configuration Guide.</li></ul>"
        schema:
          type: string
        example: "items={start}-{end}"
      - name: X-Tenant-Id
        in: header
        description: The tenant of the current request. Should be provided only when
          multitenancy is enabled in the system configuration.
        schema:
          type: string
        example: Microtel
      requestBody:
        description: Product Offering Qualification
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductOfferingQualification"
            examples:
              Example 1:
                summary: Request - Get Product Offering by ID
                description: Request -  Get Product Offering by ID
                value:
                  instantSyncQualification: true
                  expand: productOffering
                  productOfferingExpandDepth: 1
                  productOfferingQualificationItem:
                  - id: "1"
                    expectedActivationDate: 2019-08-25T00:00:00.000Z
                    productOffering:
                      id: PO_B2B_RBT
              Example 2:
                summary: Request - Get Product Offering by Context Specification
                description: Request - Get Product Offering by Context Specification
                value:
                  instantSyncQualification: true
                  category:
                    id: BusinessPhones
                  expand: productOffering
                  productOfferingExpandDepth: 1
                  productOfferingQualificationItem:
                  - id: "123"
                  contextSpecification:
                    id: contextSpec
                  contextCharacteristic:
                  - name: salesChannel
                    value: CSR
                  - name: stateCode
                    value: "ON"
              Example 3:
                summary: Request - Get Product Offering by Product Specification
                description: "Request -  Get Product Offering by Product Specification\
                  \ <br><br><strong>Note</strong> <br>The Category Id is mandatory\
                  \ when searching PO by product specification, otherwise it results\
                  \ in an insufficient search criteria exception."
                value:
                  instantSyncQualification: true
                  category:
                    id: Mobile
                  productOfferingExpandDepth: 0
                  productOfferingQualificationItem:
                  - id: "1"
                    expectedActivationDate: 2019-08-25T00:00:00.000Z
                    product:
                      productSpecification:
                        id: PS_B2B_RBT
              Example 4:
                summary: Request - Get Product Offering by Product Category
                description: Request - Get Product Offering by Product Category
