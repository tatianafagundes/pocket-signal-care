                  - id: "123"
                  shoppingCartId: 21019-9942-10000372-96050126
              Example 13:
                summary: Request - Get Product Offering by ID with Agreement Array
                  Information
                description: Request - Get Product Offering by ID with Agreement Array
                  Information
                value:
