                  contextSpecification:
                    id: CS_AV_LOCATION
                  contextCharacteristic:
                  - name: customerLocation
                    value: QUEBEC1
              Example 11:
                summary: Request - Get Product Offering by ID with CascadeFrom Attribute
                description: Request -  Get Product Offering by ID with CascadeFrom
                  Attribute
                value: "{\"instantSyncQualification\":true,\"expand\":\"productOffering\"\
                  ,\"productOfferingExpandDepth\":1,\"productOfferingQualificationItem\"\
                  :[{\"id\":\"1\",\"productOffering\":{\"id\":\"PO_NOKIA9\"}}]}"
              Example 12:
