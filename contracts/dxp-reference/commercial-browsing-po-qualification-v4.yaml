                      id: PO_SE_SLA
              Example 14:
                summary: "Request - Get Product Offering by Product Offering Filter\
                  \ Criteria as Category ID, Target ID and array of Related Entity\
                  \ ID(s)"
                description: "Request - Get Product Offering by Product Offering Filter\
