                  category:
                    id: resMobile
                  productOfferingQualificationItem:
                  - id: "123"
                    expectedActivationDate: 2019-08-25T00:00:00.000Z
              Example 5:
                summary: Request - Get Product Offering by Shopping Cart Id
                description: Request - Get Product Offering by Shopping Cart Id
                value:
                  instantSyncQualification: true
                  category:
                    id: resMobile
                  productOfferingQualificationItem:
                  - id: "123"
                  shoppingCartId: "6831953457523753503"
              Example 6:
                summary: Request - Get Product Offering by Product Offering Filter
                  Criteria
                description: "Request - Get Product Offering by Product Offering Filter\
                  \ Criteria <br><br><strong>Note:</strong> <br>For Filtering Criteria,\
                  \ refer to Filtering Criteria section"
                value:
                  instantSyncQualification: true
                  productOfferingQualificationItem:
                  - id: "1"
                    expectedActivationDate: 2019-08-25T00:00:00.000Z
                    productOfferingFilter: "{productOffering.category.id.in=[BusinessCategory]}"
              Example 7:
