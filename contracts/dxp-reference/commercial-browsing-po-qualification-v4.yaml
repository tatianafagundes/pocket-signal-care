                  Criteria
                description: "Request - Get Product Offering by Product Offering Filter\
                  \ Criteria as relation type<br><br><strong>Note:</strong> <br>For\
                  \ Filtering Criteria, refer to Filtering Criteria section"
                value:
                  instantSyncQualification: true
                  returnedProductOfferingFields: "id,name"
                  productOfferingQualificationItem:
                  - id: "1"
                    productOfferingFilter: "{productOffering.category.id=Mobile},{productOffering.productOfferingRelationship.contains=[{source.id=BPO_B2C_MB_PREP_TP_PPMAX},{relationType=changeableTo}]}"
              Example 8:
