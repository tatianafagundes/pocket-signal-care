components:
  schemas:
    Action:
      title: Action
      type: object
      properties:
        id:
          type: string
          description: Unique recognition or identification of the action implementation
        type:
          type: string
          description: Field classifying if the action is a do action or a Wait/checkpoint
        orderAction:
          type: string
          description: "For example: Add, Disconnect, Migrate, Suspend and Terminate"
        subAction:
          type: string
          description: "These are configurable enumerations.Basket.submit(),Basket.add(),Basket.validate()"
        implementationType:
          type: string
          description: "Action implementation Type that could be an eventName, a workflowName,\
            \ an eligibilityRule or a specification describing the action implementation\
            \ f Type is not \"checkpoint\".\r\n\r\nEvent, workflow,actionSpecification,elegibility,\
            \ entityState, Poll."
        implementationValue:
          type: string
          description: "A rule or principle represented in symbols, numbers, or letters,\
            \ often in the form of an equation used to derive the value of a characteristic\
            \ value. (CATALOG RULE CODE)\r\n\r\nIf implementationType is \"actionSpecification\"\
            \ then this refers to fulfillmentConfigurationSpec."
        executionType:
          type: string
          description: "Execution Type indicate whether an order is process synchronously\
            \ or asynchronously. Possible values are SYNC, ASYNC with default value\
            \ ASYNC."
      description: The action that can be taken for a certain resource.
    AgreementRef:
      title: AgreementRef
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of a related entity.
        name:
          type: string
          description: The name of the related entity.
        href:
          type: string
          description: Reference of the related entity.
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
        '@type':
          type: string
          description: "When sub-classing, this defines the sub-class entity name."
        '@schemaLocation':
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        '@baseType':
          type: string
          description: "When sub-classing, this defines the super-class."
      description: An agreement represents a contract or arrangement.
    AlternateProductOfferingProposal:
      title: AlternateProductOfferingProposal
      type: object
      properties:
        id:
          type: string
          description: Identifier of a alternate product offering proposal
        alternateProductOffering:
          $ref: "#/components/schemas/ProductOfferingReforValue"
        '@baseType':
          type: string
          description: "When sub-classing, this defines the super-class"
        '@schemaLocation':
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships
        '@type':
          type: string
          description: "When sub-classing, this defines the sub-class entity name"
      description: Alternate Product Offering Proposal is used when the requested
        product offering is not available with characteristic and date asked for.
        An alternate proposal could be a distinct product offering or product specification
        close to requested one or the same as requested but with a different activation
        date.
    Attachment:
      title: Attachment
      type: object
      properties:
        description:
          type: string
          description: A narrative text describing the content of the attachment
        href:
          type: string
          description: URI for the given entity. This is a system-generated URI for
            a given entity. Using it the entity can be separately addressed over Hypermedia
        id:
          type: string
          description: "Unique identifier of a given entity. Although this is system\
            \ generated, in specific situations, it can be specified as temporary\
            \ id when creating several entities as part of a single request and one\
            \ entity needs to refer to another within the same request. After the\
            \ entities are created, temporary ids are replaced with system generated\
            \ ones. When specifying temporary ids, it is recommended that a prefix,\
            \ such as \"tmp\", is used. For example: tmp0001"
        type:
          type: string
          description: "Attachment type such as video, picture"
        url:
          type: string
          description: "Uniform Resource Locator, is a web page address (a subset\
            \ of URI)"
        mimeType:
          type: string
          description: "Attachment mime type such as extension file for video, picture\
            \ and document"
        '@type':
          type: string
          description: The class type of the attachment
        '@baseType':
          type: string
          description: The immediate base class type of the attachment
        '@schemaLocation':
          type: string
          description: A link to the schema describing the attachment entity
      description: "Complements the description of an element (for instance a product)\
        \ through video, pictures, for example."
    Cardinality:
      title: Cardinality
      type: object
      properties:
